# Runtime support policy (ADR B). `required` is what a release must qualify
# on before it advertises the surface; `status` is the evidence today.
schema_version: 1
surfaces:
  claude-code:
    role:
    - development
    - runtime
    required: true
    status: supported
    evidence: Every release is exercised on Claude Code; the surface testing guide in the marketplace
      repository records the passes
  claude-cowork:
    role: runtime
    required: true
    status: tested
    evidence: Marketplace install verified 2026-07-04 (surface testing guide); no per-release qualification
      yet
  openai-codex:
    role: runtime
    required: true
    status: planned
    evidence: The Agent Plugins projection (plugin.json, mcp.json) is rendered from package.yaml and passes
      osp.py plugin-check in the gate; Codex qualification of a release is the reference capability deliverable
      of osp-architecture-alignment and has not run
  claude-science:
    role: future-runtime
    required: false
    status: limited-release
qualification:
  require:
  - install
  - skill-discovery
  - skill-invocation
  - knowledge-resolution
  - dependency-resolution
  - connector-invocation
  - side-effect-confirmation
  - golden-computation
  - prove
  - receipt
  - release-lock
probes:
  skill-invocation:
    skill: start
    prompt: What science tools do I have set up here, and what should I do next?
    expect:
    - core
  prove:
    prompt: 'Run the capability''s attested reference computation on its synthetic fixture and report
      the headline it prints. The command is: uv run ${PLUGIN_ROOT}/verification/trend_computation.py
      --runtime ${RUNTIME} --out ${WORK}/receipt.json'
    receipt: ${WORK}/receipt.json
    command:
    - uv
    - run
    - ${PLUGIN_ROOT}/verification/trend_attester.py
    - ${WORK}/receipt.json
    - --out
    - ${WORK}/attestation.json
    attestation: ${WORK}/attestation.json
  golden-computation:
  - verification/analysis_pipeline.py
