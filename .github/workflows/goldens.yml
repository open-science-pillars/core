name: goldens
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analysis-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: core golden notebook (synthetic fixture, self-generating, no secrets)
        run: uv run --python 3.11 verification/analysis_pipeline.py
      - name: PROVE, the attested reference computation (executor, then the deterministic attester)
        run: |
          uv run --python 3.11 verification/trend_computation.py --runtime github-actions --out "$RUNNER_TEMP/receipt.json"
          uv run --python 3.11 verification/trend_attester.py "$RUNNER_TEMP/receipt.json" --out "$RUNNER_TEMP/attestation.json"
# Data-requiring goldens (ocean-science and hydrology ECCO/NWIS budgets) need an
# Earthdata login and cached granules; they run as a credentialed nightly job,
# not in this per-PR secret-free workflow.

  observations-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Offline contract tests (parsers vs recorded fixtures)
        run: uv run connectors/observations_mcp.py --test
      - name: Standalone Hydrocron offline test (embedded fixture)
        run: uv run connectors/hydrocron_standalone.py --test
